version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Сохраняем БД и загруженные фото между перезапусками контейнера
      - ./instance:/app/instance
      - ./static/photos:/app/static/photos
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
    restart: unless-stopped